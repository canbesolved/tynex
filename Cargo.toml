[package]
name = "tynex"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
description = """
Thank You, NEXt: efficient task switcher for Linux, macOS and \
Windows"""
license = "MIT"
readme = "README.md"
repository = "https://github.com/canbesolved/tynex"
homepage = "https://github.com/canbesolved/tynex"
keywords = ["task-switcher", "window-switcher", "wayland", "kde"]
categories = ["gui"]

[dependencies]
frizbee = "0.13.0"
lexopt = "0.3.2"
resvg = { version = "0.48.1", default-features = false }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
skrifa = { version = "0.48.0", default-features = false, features = ["std"] }
tiny-skia = { version = "0.12.0", default-features = false, features = [
    "png-format",
    "simd",
    "std",
] }
toml = { version = "1.1.8", default-features = false, features = [
    "parse",
    "serde",
    "std",
] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9.12", default-features = false }
rustix = { version = "1.1.5", features = ["event", "fs", "mm", "process"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
xkbcommon = { version = "0.9.0", default-features = false }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"     # Keep symbol names for backtraces
