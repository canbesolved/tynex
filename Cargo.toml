[package]
name = "tynex"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = """
Thank You, NEXt: efficient task switcher for Linux, macOS and \
Windows"""
license = "MIT"
readme = "README.md"
repository = "https://github.com/canbesolved/tynex"
homepage = "https://github.com/canbesolved/tynex"
keywords = ["task-switcher", "window-switcher", "wayland", "kde"]
categories = ["gui"]

[dependencies]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"     # Keep symbol names for backtraces
