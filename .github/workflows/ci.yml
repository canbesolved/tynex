# Runs the Tooling checks from AGENTS.md on every pull request and on
# every push to main. Actions are pinned to full commit hashes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain master (2026-10-16)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly
          components: rustfmt
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: clippy
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo +nightly fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Keep in sync with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo check --all-targets

  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    env:
      DENY_VERSION: "0.20.2"
      # SHA-256 of the x86_64 musl release archive, checked locally.
      DENY_SHA256: >-
        9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Install prebuilt cargo-deny
        run: |
          name="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download"
          curl -sSfL -o deny.tar.gz "$url/$DENY_VERSION/$name.tar.gz"
          echo "$DENY_SHA256  deny.tar.gz" | sha256sum -c -
          tar -xzf deny.tar.gz
          install -m 755 "$name/cargo-deny" "$HOME/.cargo/bin/"
      - run: cargo deny check

  docs:
    name: Docs, scripts and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - run: npm install -g markdownlint-cli2@0.23.3 adr-log@2.2.0
      - run: pipx install reuse==6.2.0
      - run: markdownlint-cli2 "**/*.md"
      - run: shellcheck scripts/*.sh
      - run: reuse lint
      - name: ADR index is up to date
        run: |
          scripts/adr_log.sh
          git diff --exit-code docs/adr/index.md
