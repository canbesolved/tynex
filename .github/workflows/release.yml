# Builds the release archives when a version tag is pushed (ADR-0042),
# creates the GitHub release if needed and attaches the archives with a
# SHA256SUMS file. A manual run builds only, as a dry run. Actions are
# pinned to full commit hashes.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Tag matches the version in Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libxkbcommon-dev libdbus-1-dev pkg-config
      # dtolnay/rust-toolchain master (2026-10-16)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - run: cargo build --release --locked
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          name="tynex-$version-$TARGET"
          mkdir "$name"
          cp target/release/tynex README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          ls -l "$name.tar.gz" "$name/tynex"
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.target }}
          path: tynex-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum tynex-*.tar.gz > SHA256SUMS
      - name: Create the release and attach the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            awk -v v="$version" '
              index($0, "## [" v "]") == 1 { on = 1; next }
              /^## \[|^\[Unreleased\]:/ { if (on) exit }
              on
            ' CHANGELOG.md > notes.md
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "tynex $version" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
